name: Weekly digest

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Collect stats and post digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          stars=$(gh api "repos/$repo" --jq .stargazers_count)
          forks=$(gh api "repos/$repo" --jq .forks_count)
          watchers=$(gh api "repos/$repo" --jq .subscribers_count)
          open_issues=$(gh api "repos/$repo/issues?state=open&per_page=100" --jq '[.[]|select(.pull_request==null)]|length')
          views=$(gh api "repos/$repo/traffic/views" --jq .count 2>/dev/null || echo "n/a")
          uniques=$(gh api "repos/$repo/traffic/views" --jq .uniques 2>/dev/null || echo "n/a")

          body=$(printf '**Week of %s**\n\n| metric | value |\n| --- | --- |\n| stars | %s |\n| forks | %s |\n| watchers | %s |\n| open issues | %s |\n| views (14d) | %s |\n| unique visitors (14d) | %s |\n\n<sub>Auto-generated by the weekly digest workflow.</sub>' \
            "$(date -u +%Y-%m-%d)" "$stars" "$forks" "$watchers" "$open_issues" "$views" "$uniques")

          num=$(gh issue list --repo "$repo" --state open \
            --search '"Weekly digest" in:title' --json number --jq '.[0].number // empty')

          if [ -z "$num" ]; then
            gh issue create --repo "$repo" \
              --title "Weekly digest" \
              --body "$body"
          else
            gh issue comment "$num" --repo "$repo" --body "$body"
          fi
