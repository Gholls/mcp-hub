  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <title>mcp.gholl.com — Interactive micro-tools for humans & AI agents</title>
    <meta
      name="description"
      content="A hub of fast, login-free interactive micro-tools. Built for humans in the browser and for AI agents via the Model Context Protocol (MCP Apps)."
    />
    <meta property="og:title" content="mcp.gholl.com — Interactive micro-tools" />
    <meta
      property="og:description"
      content="Fast, login-free interactive micro-tools for humans and AI agents. MCP Apps ready."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mcp.gholl.com/" />
    <meta property="og:image" content="https://mcp.gholl.com/og/site.png" />
    <meta property="og:image:width" content="1200" />

  <body>
    <div id="root">
      <div id="gholl-boot">
        <span class="boot-spin"></span>
        <span>mcp.gholl.com</span>
      </div>
    </div>
    <style>
      #gholl-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100vh;
        color: #64748b;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #gholl-boot .boot-spin {
        width: 16px;
        height: 16px;
        border-radius: 9999px;
        border: 2px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        animation: gholl-boot-spin 0.7s linear infinite;
      }
      @keyframes gholl-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
